spring.application.name=tasks

spring.datasource.url=jdbc:mysql://localhost:3306/tasks?tasks?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2810
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=true